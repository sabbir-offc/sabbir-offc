name: Refresh stat cards

# The public card services only see public repositories, which for this account
# reports JavaScript as the top language off the back of old bootcamp projects.
# These cards are generated from an authenticated token instead, so they need a
# scheduled job to stay current.
#
# Requires a repository secret named STATS_TOKEN: a GitHub PAT with `repo` scope
# (read access to private repositories). Without it the run fails loudly rather
# than silently publishing public-only numbers.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/gen_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/card-*.svg
          if git diff --quiet --cached; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh stat cards"
            git push
          fi
