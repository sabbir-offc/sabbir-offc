<svg xmlns="http://www.w3.org/2000/svg" width="920" height="158" viewBox="0 0 920 158" role="img" aria-label="By the numbers">
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif; }
    .t { font-size: 15px; font-weight: 600; fill: #0969DA; }
    .s { font-size: 10.5px; fill: #6E7781; }
    .l { font-size: 11.5px; fill: #1F2328; }
    .m { font-size: 11px; fill: #57606A; }
    .n { font-size: 27px; font-weight: 700; fill: #1F2328; }
    .k { font-size: 10px; fill: #6E7781; letter-spacing: .04em; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="157" rx="6"
        fill="#FFFFFF" stroke="#D0D7DE"/>
  <text class="t" x="22" y="30">By the numbers</text>
  <text class="s" x="22" y="48">every repository, public and private · as of 2026-08-11</text>
  <text class="n" x="22" y="112">2,694</text><text class="k" x="22" y="131">COMMITS, ALL TIME</text>
  <text class="n" x="197" y="112">77%</text><text class="k" x="197" y="131">OF THEM PRIVATE</text>
  <text class="n" x="372" y="112">149</text><text class="k" x="372" y="131">REPOSITORIES</text>
  <text class="n" x="548" y="112">65</text><text class="k" x="548" y="131">PRIVATE REPOS</text>
  <text class="n" x="723" y="112">83%</text><text class="k" x="723" y="131">TYPESCRIPT</text>
</svg>
